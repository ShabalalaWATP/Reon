# LOCAL DEVELOPMENT ONLY. This topology exposes an unauthenticated Camunda API
# on host loopback and is not a production deployment template.
name: mist-service-local
x-runtime-security: &runtime-security
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
x-api-image: &api-image
  build: {context: ., dockerfile: apps/api/Dockerfile}
  image: mist-service-local-api
x-runtime-environment: &runtime-environment
  ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  CAMUNDA_REST_ADDRESS: http://orchestration:8080
  CAMUNDA_AUTH_MODE: NONE
  CAMUNDA_PROCESS_ID: ${CAMUNDA_PROCESS_ID:-service-request-v1}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?Set SESSION_COOKIE_SECURE in .env}
  WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
  MANAGED_PRODUCTS_ENABLED: ${MANAGED_PRODUCTS_ENABLED:-false}
  WORKER_HEALTH_REQUIRED: ${WORKER_HEALTH_REQUIRED:-true}
  WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-10}
  REQUEST_MATCHING_SEMANTIC_ENABLED: ${REQUEST_MATCHING_SEMANTIC_ENABLED:-true}
  ALLOW_DEMO_USERS: ${ALLOW_DEMO_USERS:?Set ALLOW_DEMO_USERS in .env}
  AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?Set AUDIT_HMAC_KEY in .env}
  SECURITY_PSEUDONYM_KEY: ${SECURITY_PSEUDONYM_KEY:?Set SECURITY_PSEUDONYM_KEY in .env}
x-clamav-runtime: &clamav-runtime
  build:
    context: .
    dockerfile: infra/clamav/Dockerfile
  image: mist/clamav-local:1.5.3
  user: "100:101"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:uid=100,gid=101,mode=1777
services:
  postgres-data-init:
    <<: *runtime-security
    image: mist/postgres-local:17.10-pgvector0.8.1-alpine3.23
    pull_policy: never
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /var/lib/postgresql/data &&
        chown -R 70:70 /var/lib/postgresql/data &&
        chmod 0700 /var/lib/postgresql/data
    network_mode: none
    read_only: true
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: "no"
  postgres:
    <<: *runtime-security
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    image: mist/postgres-local:17.10-pgvector0.8.1-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      APP_DATABASE_NAME: ${APP_DATABASE_NAME:?Set APP_DATABASE_NAME in .env}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?Set APP_DATABASE_USER in .env}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
      APP_RUNTIME_DATABASE_USER: ${APP_RUNTIME_DATABASE_USER:?Set APP_RUNTIME_DATABASE_USER in .env}
      APP_RUNTIME_DATABASE_PASSWORD: ${APP_RUNTIME_DATABASE_PASSWORD:?Set APP_RUNTIME_DATABASE_PASSWORD in .env}
      APP_BACKUP_DATABASE_USER: ${APP_BACKUP_DATABASE_USER:?Set APP_BACKUP_DATABASE_USER in .env}
      APP_BACKUP_DATABASE_PASSWORD: ${APP_BACKUP_DATABASE_PASSWORD:?Set APP_BACKUP_DATABASE_PASSWORD in .env}
      APP_MAINTENANCE_DATABASE_USER: ${APP_MAINTENANCE_DATABASE_USER:?Set APP_MAINTENANCE_DATABASE_USER in .env}
      APP_MAINTENANCE_DATABASE_PASSWORD: ${APP_MAINTENANCE_DATABASE_PASSWORD:?Set APP_MAINTENANCE_DATABASE_PASSWORD in .env}
      CAMUNDA_DATABASE_NAME: ${CAMUNDA_DATABASE_NAME:?Set CAMUNDA_DATABASE_NAME in .env}
      CAMUNDA_DATABASE_USER: ${CAMUNDA_DATABASE_USER:?Set CAMUNDA_DATABASE_USER in .env}
      CAMUNDA_DATABASE_PASSWORD: ${CAMUNDA_DATABASE_PASSWORD:?Set CAMUNDA_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=3775
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host 127.0.0.1 --username postgres --dbname postgres
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    depends_on:
      postgres-data-init:
        condition: service_completed_successfully
    networks:
      - data
  camunda-data-init:
    <<: *runtime-security
    image: mist/camunda-local:8.9.14
    pull_policy: never
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        chown -R 1001:1001 /usr/local/camunda/data
        /usr/local/camunda/camunda-data &&
        chmod -R 0750 /usr/local/camunda/data
        /usr/local/camunda/camunda-data
    volumes:
      - camunda-primary-data:/usr/local/camunda/data
      - camunda-runtime-data:/usr/local/camunda/camunda-data
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    network_mode: none
    read_only: true
    restart: "no"
  orchestration:
    <<: *runtime-security
    build:
      context: .
      dockerfile: infra/camunda/Dockerfile
    image: mist/camunda-local:8.9.14
    environment:
      CAMUNDA_DATABASE_NAME: ${CAMUNDA_DATABASE_NAME:?Set CAMUNDA_DATABASE_NAME in .env}
      CAMUNDA_DATABASE_USER: ${CAMUNDA_DATABASE_USER:?Set CAMUNDA_DATABASE_USER in .env}
      CAMUNDA_DATABASE_PASSWORD: ${CAMUNDA_DATABASE_PASSWORD:?Set CAMUNDA_DATABASE_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "127.0.0.1:${CAMUNDA_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${CAMUNDA_MANAGEMENT_HOST_PORT:-9600}:9600"
    volumes:
      - camunda-primary-data:/usr/local/camunda/data
      - camunda-runtime-data:/usr/local/camunda/camunda-data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 &&
          printf "GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200" <&3'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      camunda-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [data, workflow]
  product-storage-init:
    <<: *runtime-security
    image: python:3.13-alpine3.23@sha256:9fdbf2e3e82628351513560b121e2ee6ce31cac212be9e070c5a5e2769fb5e76
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /var/lib/mist-products &&
        chmod 0750 /var/lib/mist-products &&
        chown -R 10001:10001 /var/lib/mist-products
    network_mode: none
    read_only: true
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - product-storage:/var/lib/mist-products
    restart: "no"
  api:
    <<: [*runtime-security, *api-image]
    environment:
      <<: *runtime-environment
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-30}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-mist_session}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-3600}
      ADMIN_ELEVATION_SECONDS: ${ADMIN_ELEVATION_SECONDS:-300}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_PER_SOURCE: ${LOGIN_RATE_LIMIT_PER_SOURCE:-30}
      LOGIN_RATE_LIMIT_GLOBAL: ${LOGIN_RATE_LIMIT_GLOBAL:-300}
      LOGIN_RATE_LIMIT_TIMEOUT_SECONDS: ${LOGIN_RATE_LIMIT_TIMEOUT_SECONDS:-3}
      LOGIN_HASH_CONCURRENCY: ${LOGIN_HASH_CONCURRENCY:-2}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      PRODUCT_STORAGE_PATH: ${PRODUCT_STORAGE_PATH:-/var/lib/mist-products}
      PRODUCT_ALLOWED_EXTERNAL_DOMAINS: ${PRODUCT_ALLOWED_EXTERNAL_DOMAINS:-products.example.test}
      PRODUCT_UPLOAD_TTL_SECONDS: ${PRODUCT_UPLOAD_TTL_SECONDS:-600}
      PRODUCT_MAX_FILE_BYTES: ${PRODUCT_MAX_FILE_BYTES:-26214400}
      PRODUCT_MAX_PACKAGE_BYTES: ${PRODUCT_MAX_PACKAGE_BYTES:-104857600}
      PRODUCT_CLAMAV_HOST: ${PRODUCT_CLAMAV_HOST:-clamav}
      PRODUCT_CLAMAV_PORT: ${PRODUCT_CLAMAV_PORT:-3310}
      PRODUCT_CLAMAV_TIMEOUT_SECONDS: ${PRODUCT_CLAMAV_TIMEOUT_SECONDS:-30}
      ACTION_WORKSPACE_ENABLED: ${ACTION_WORKSPACE_ENABLED:-false}
      MANAGED_FILE_UPLOADS_ENABLED: ${MANAGED_FILE_UPLOADS_ENABLED:-true}
      CONFIGURATION_ADMIN_ENABLED: ${CONFIGURATION_ADMIN_ENABLED:-false}
      PLANNING_EVOLUTION_ENABLED: ${PLANNING_EVOLUTION_ENABLED:-false}
      STATISTICS_EVOLUTION_ENABLED: ${STATISTICS_EVOLUTION_ENABLED:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      clamav:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      product-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - product-storage:/var/lib/mist-products
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks: [data, scanner, service, workflow]
  worker:
    <<: [*runtime-security, *api-image]
    command: ["mist-worker"]
    environment:
      <<: *runtime-environment
      DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${WORKER_DATABASE_MAX_OVERFLOW:-5}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-0.5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
      REQUEST_EMBEDDING_THREADS: ${REQUEST_EMBEDDING_THREADS:-2}
      REQUEST_EMBEDDING_BATCH_SIZE: ${REQUEST_EMBEDDING_BATCH_SIZE:-8}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,worker}
      PRODUCT_STORAGE_PATH: ${PRODUCT_STORAGE_PATH:-/var/lib/mist-products}
    depends_on:
      orchestration:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      product-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - product-storage:/var/lib/mist-products
    networks: [data, workflow]
  clamav-updater:
    <<: [*runtime-security, *clamav-runtime]
    environment:
      CLAMAV_NO_CLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
      CLAMAV_HEALTH_CHECK_DAEMON: "false"
      CLAMAV_SIGNATURE_MAX_AGE_HOURS: ${CLAMAV_SIGNATURE_MAX_AGE_HOURS:-48}
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - signature-updates
  clamav:
    <<: [*runtime-security, *clamav-runtime]
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
      CLAMAV_SIGNATURE_MAX_AGE_HOURS: ${CLAMAV_SIGNATURE_MAX_AGE_HOURS:-48}
    volumes:
      - clamav-data:/var/lib/clamav:ro
    depends_on:
      clamav-updater:
        condition: service_healthy
    networks:
      - scanner
  migrator:
    <<: [*runtime-security, *api-image]
    command:
      - sh
      - -c
      - alembic upgrade head && python -m mist_service.postgres_permissions
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env}
      APP_RUNTIME_DATABASE_USER: ${APP_RUNTIME_DATABASE_USER:?Set APP_RUNTIME_DATABASE_USER in .env}
      APP_BACKUP_DATABASE_USER: ${APP_BACKUP_DATABASE_USER:?Set APP_BACKUP_DATABASE_USER in .env}
      APP_MAINTENANCE_DATABASE_USER: ${APP_MAINTENANCE_DATABASE_USER:?Set APP_MAINTENANCE_DATABASE_USER in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks:
      - data
  web:
    <<: *runtime-security
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: mist-service-local-web
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    networks: [front-door, service]
volumes:
  postgres-data:
  camunda-primary-data:
  camunda-runtime-data:
  clamav-data:
  product-storage:
networks:
  data: {internal: true}
  front-door:
  scanner: {internal: true}
  signature-updates:
  service: {internal: true}
  workflow: {internal: true}
