version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      npm-runtime-and-tooling:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      python-runtime-and-tooling:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      workflow-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/postgres
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/camunda
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/clamav
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
