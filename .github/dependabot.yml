version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      npm-runtime-and-tooling:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      python-runtime-and-tooling:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      workflow-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/postgres
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/camunda
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/clamav
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/London
    cooldown:
      default-days: 7
    # These names are outputs of local Dockerfile builds, not registry inputs.
    # Their real upstream dependencies are managed by the Docker ecosystems above.
    ignore:
      - dependency-name: mist-service-local-api
      - dependency-name: mist-service-local-web
      - dependency-name: mist/camunda-local
      - dependency-name: mist/clamav-local
      - dependency-name: mist/postgres-local
    open-pull-requests-limit: 5
