services:
  postgres:
    cpus: 1.0
    mem_limit: 768m

  orchestration:
    cpus: 2.0
    mem_limit: 3g
    environment:
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2304m
      CAMUNDA_PROCESSINSTANCECREATION_BUSINESSIDUNIQUENESSENABLED: "true"

  clamav:
    cpus: 1.0
    mem_limit: 1536m

  api:
    cpus: 1.0
    mem_limit: 768m
    environment:
      ACTION_WORKSPACE_ENABLED: "true"
      MANAGED_PRODUCTS_ENABLED: "true"
      MANAGED_FILE_UPLOADS_ENABLED: "false"
      NOTIFICATIONS_ENABLED: "true"
      PRODUCT_ALLOWED_EXTERNAL_DOMAINS: products.example.test

  worker:
    cpus: 1.0
    mem_limit: 768m
    environment:
      ACTION_WORKSPACE_ENABLED: "true"
      MANAGED_PRODUCTS_ENABLED: "true"
      MANAGED_FILE_UPLOADS_ENABLED: "false"
      NOTIFICATIONS_ENABLED: "true"

  web:
    cpus: 1.0
    mem_limit: 512m
