<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ISTARI Service container architecture</title>
  <desc id="desc">A C4-style container diagram showing the web application, API, worker, databases, Camunda, storage and malware scanner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0c1923"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6bbbdc"/></marker>
    <style>.title{font:700 30px Inter,Segoe UI,sans-serif;fill:#f4f8fb}.subtitle{font:400 15px Inter,Segoe UI,sans-serif;fill:#91a9b8}.eyebrow{font:700 12px ui-monospace,Consolas,monospace;letter-spacing:2px;fill:#36c7ff}.tag{font:700 11px ui-monospace,Consolas,monospace;letter-spacing:1px;fill:#7dd7ff}.name{font:700 18px Inter,Segoe UI,sans-serif;fill:#f4f8fb}.copy{font:400 13px Inter,Segoe UI,sans-serif;fill:#afc0cb}.small{font:600 11px Inter,Segoe UI,sans-serif;fill:#91a9b8}.boundary{fill:#0a141c;stroke:#2b536a;stroke-width:1.6;stroke-dasharray:8 7}.box{fill:#101e28;stroke:#326078;stroke-width:1.5}.core{fill:#102a3b;stroke:#36c7ff;stroke-width:2}.data{fill:#17231f;stroke:#45c88a;stroke-width:1.5}.external{fill:#1c1b20;stroke:#9671c8;stroke-width:1.5}.security{fill:#201c17;stroke:#d5a449;stroke-width:1.5}.line{fill:none;stroke:#6bbbdc;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}.label{font:600 11px Inter,Segoe UI,sans-serif;fill:#86c6df}</style>
  </defs>
  <rect width="1600" height="980" rx="24" fill="url(#bg)"/>
  <text x="64" y="60" class="eyebrow">C4 · CONTAINER VIEW</text><text x="64" y="101" class="title">What runs, and how the pieces communicate</text>
  <text x="64" y="132" class="subtitle">The browser talks to one trusted API. Camunda, databases, storage and scanning remain behind that boundary.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="206" width="230" height="126" rx="16" class="box"/>
    <text x="90" y="238" class="tag">PERSON + BROWSER</text><text x="90" y="270" class="name">Authenticated user</text>
    <text x="90" y="297" class="copy">Uses a supported web browser</text>

    <rect x="340" y="166" width="1196" height="740" rx="24" class="boundary"/>
    <text x="370" y="200" class="tag">ISTARI SERVICE DEPLOYMENT BOUNDARY</text>

    <rect x="406" y="246" width="260" height="154" rx="16" class="core"/>
    <text x="434" y="278" class="tag">CONTAINER · REACT 19</text><text x="434" y="312" class="name">Web application</text>
    <text x="434" y="340" class="copy">Pages, forms and accessible navigation</text>
    <text x="434" y="365" class="copy">Served by a non-root Nginx image</text>

    <rect x="764" y="238" width="316" height="170" rx="16" class="core"/>
    <text x="794" y="270" class="tag">CONTAINER · FASTAPI</text><text x="794" y="304" class="name">Application API</text>
    <text x="794" y="332" class="copy">Validates, authorises and records actions</text>
    <text x="794" y="357" class="copy">Owns business use cases and projections</text>
    <text x="794" y="382" class="copy">Never trusts navigation as permission</text>

    <rect x="764" y="488" width="316" height="156" rx="16" class="box"/>
    <text x="794" y="520" class="tag">CONTAINER · PYTHON WORKER</text><text x="794" y="554" class="name">Fenced worker</text>
    <text x="794" y="582" class="copy">Dispatches durable commands and reconciles</text>
    <text x="794" y="607" class="copy">Runs external calls outside SQL transactions</text>

    <rect x="406" y="504" width="260" height="140" rx="16" class="data"/>
    <text x="434" y="536" class="tag">DATABASE · POSTGRESQL 17</text><text x="434" y="570" class="name">Application database</text>
    <text x="434" y="598" class="copy">Requests, users, audit, assignments,</text>
    <text x="434" y="622" class="copy">products, calendars and read models</text>

    <rect x="406" y="704" width="260" height="130" rx="16" class="data"/>
    <text x="434" y="736" class="tag">DATABASE · SEPARATE OWNER</text><text x="434" y="770" class="name">Camunda database</text>
    <text x="434" y="798" class="copy">Owned only by Camunda, never read</text><text x="434" y="820" class="copy">by application code</text>

    <rect x="1178" y="238" width="290" height="150" rx="16" class="external"/>
    <text x="1206" y="270" class="tag">EXTERNAL CONTAINER</text><text x="1206" y="304" class="name">Camunda 8.9</text>
    <text x="1206" y="332" class="copy">BPMN process position and human tasks</text>
    <text x="1206" y="357" class="copy">No request narrative or product content</text>

    <rect x="1178" y="470" width="290" height="140" rx="16" class="security"/>
    <text x="1206" y="502" class="tag">PRIVATE STORAGE</text><text x="1206" y="536" class="name">Product objects</text>
    <text x="1206" y="564" class="copy">Quarantine, clean storage and controlled</text><text x="1206" y="588" class="copy">authenticated download</text>

    <rect x="1178" y="676" width="290" height="130" rx="16" class="security"/>
    <text x="1206" y="708" class="tag">INTERNAL SECURITY SERVICE</text><text x="1206" y="742" class="name">ClamAV scanner</text>
    <text x="1206" y="770" class="copy">Scans complete quarantined uploads</text><text x="1206" y="792" class="copy">and fails closed if unavailable</text>
  </g>

  <path d="M294 270H406" class="line"/><text x="318" y="256" class="label">HTTPS target</text>
  <path d="M666 322H764" class="line"/><text x="689" y="307" class="label">same-origin /api</text>
  <path d="M764 374C680 408 590 450 548 504" class="line"/><text x="620" y="430" class="label">short SQL transactions</text>
  <path d="M922 408V488" class="line dashed"/><text x="936" y="451" class="label">durable work</text>
  <path d="M764 572H666" class="line"/><text x="676" y="556" class="label">lease + reconcile</text>
  <path d="M1080 300H1178" class="line"/><text x="1103" y="285" class="label">V2 API</text>
  <path d="M1080 540C1120 510 1134 510 1178 520" class="line"/><text x="1101" y="492" class="label">dispatch</text>
  <path d="M1178 328C1108 400 1060 644 666 768" class="line dashed"/><text x="960" y="677" class="label">Camunda owns its database</text>
  <path d="M1080 350C1130 390 1134 500 1178 530" class="line"/><text x="1090" y="428" class="label">quarantine / stream</text>
  <path d="M1323 610V676" class="line"/><text x="1338" y="649" class="label">INSTREAM</text>

  <rect x="392" y="862" width="18" height="8" rx="4" fill="#36c7ff"/><text x="420" y="871" class="small">application container</text>
  <rect x="592" y="862" width="18" height="8" rx="4" fill="#45c88a"/><text x="620" y="871" class="small">data authority</text>
  <rect x="770" y="862" width="18" height="8" rx="4" fill="#9671c8"/><text x="798" y="871" class="small">workflow dependency</text>
  <rect x="984" y="862" width="18" height="8" rx="4" fill="#d5a449"/><text x="1012" y="871" class="small">protected product boundary</text>
</svg>
