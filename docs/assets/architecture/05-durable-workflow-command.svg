<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="820" viewBox="0 0 1540 820" role="img" aria-labelledby="title desc">
  <title id="title">Durable workflow command and reconciliation</title>
  <desc id="desc">A five-step architecture diagram explaining how PostgreSQL and Camunda are kept consistent without one distributed transaction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0c1923"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64c9ed"/></marker>
    <style>.title{font:700 30px Inter,Segoe UI,sans-serif;fill:#f4f8fb}.subtitle{font:400 15px Inter,Segoe UI,sans-serif;fill:#91a9b8}.eyebrow{font:700 12px ui-monospace,Consolas,monospace;letter-spacing:2px;fill:#36c7ff}.number{font:800 24px ui-monospace,Consolas,monospace;fill:#36c7ff}.name{font:700 17px Inter,Segoe UI,sans-serif;fill:#f4f8fb}.copy{font:400 12.5px Inter,Segoe UI,sans-serif;fill:#aebfca}.step{fill:#10222e;stroke:#36718d;stroke-width:1.5}.database{fill:#14261f;stroke:#43c98b;stroke-width:1.5}.engine{fill:#1a2032;stroke:#7787cf;stroke-width:1.5}.line{fill:none;stroke:#64c9ed;stroke-width:2.2;marker-end:url(#arrow)}.safe{font:700 12px Inter,Segoe UI,sans-serif;fill:#53d89a}.warning{font:600 12px Inter,Segoe UI,sans-serif;fill:#e4b85f}</style>
  </defs>
  <rect width="1540" height="820" rx="24" fill="url(#bg)"/>
  <text x="64" y="60" class="eyebrow">CONSISTENCY PATTERN</text><text x="64" y="101" class="title">How Mist keeps PostgreSQL and Camunda aligned</text>
  <text x="64" y="132" class="subtitle">The systems cannot share one transaction. Mist records durable intent first, performs the external call, then proves the result.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="226" width="250" height="172" rx="18" class="step"/>
    <text x="90" y="264" class="number">01</text><text x="90" y="306" class="name">Authorise the person</text>
    <text x="90" y="336" class="copy">Check identity, scope, object,</text><text x="90" y="359" class="copy">assignment, state and version.</text>

    <rect x="356" y="226" width="250" height="172" rx="18" class="database"/>
    <text x="382" y="264" class="number">02</text><text x="382" y="306" class="name">Record durable intent</text>
    <text x="382" y="336" class="copy">Commit the requested action, audit</text><text x="382" y="359" class="copy">context and fenced ownership.</text>

    <rect x="648" y="226" width="250" height="172" rx="18" class="step"/>
    <text x="674" y="264" class="number">03</text><text x="674" y="306" class="name">Call Camunda</text>
    <text x="674" y="336" class="copy">The worker claims or completes the</text><text x="674" y="359" class="copy">task with no SQL lock held.</text>

    <rect x="940" y="226" width="250" height="172" rx="18" class="engine"/>
    <text x="966" y="264" class="number">04</text><text x="966" y="306" class="name">Prove the result</text>
    <text x="966" y="336" class="copy">Compare the exact task, process,</text><text x="966" y="359" class="copy">owner and generation.</text>

    <rect x="1232" y="226" width="250" height="172" rx="18" class="database"/>
    <text x="1258" y="264" class="number">05</text><text x="1258" y="306" class="name">Update the projection</text>
    <text x="1258" y="336" class="copy">Commit the visible request state and</text><text x="1258" y="359" class="copy">the tamper-evident audit event.</text>
  </g>

  <path d="M314 312H356" class="line"/><path d="M606 312H648" class="line"/><path d="M898 312H940" class="line"/><path d="M1190 312H1232" class="line"/>

  <rect x="64" y="500" width="684" height="218" rx="20" fill="#0d1c25" stroke="#2b536a"/>
  <text x="94" y="540" class="safe">WHAT THIS PROTECTS</text>
  <text x="94" y="579" class="copy">• a browser retry cannot silently complete the task twice</text>
  <text x="94" y="609" class="copy">• an engine outage produces a visible pending or failed state</text>
  <text x="94" y="639" class="copy">• a stale worker cannot record success after another worker takes over</text>
  <text x="94" y="669" class="copy">• reconciliation can recover after a timeout without inventing progress</text>

  <rect x="792" y="500" width="690" height="218" rx="20" fill="#151914" stroke="#6a5631"/>
  <text x="822" y="540" class="warning">IMPORTANT LIMIT</text>
  <text x="822" y="579" class="copy">Camunda is the authority for process position and human-task lifecycle.</text>
  <text x="822" y="609" class="copy">PostgreSQL is the authority for people, content, assignment, audit and dashboards.</text>
  <text x="822" y="639" class="copy">Neither system reads or writes the other system’s private database tables.</text>
  <text x="822" y="669" class="copy">The worker joins the two through supported APIs and durable application records.</text>
</svg>
