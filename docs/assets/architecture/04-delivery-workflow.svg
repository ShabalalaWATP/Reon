<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Product production, review and release workflow</title>
  <desc id="desc">A plain-English process diagram from Analyst assignment through production, Customer clarification, Manager review, separate QC review and release, and Customer acceptance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0c1923"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64c9ed"/></marker>
    <style>.title{font:700 30px Inter,Segoe UI,sans-serif;fill:#f4f8fb}.subtitle{font:400 15px Inter,Segoe UI,sans-serif;fill:#91a9b8}.eyebrow{font:700 12px ui-monospace,Consolas,monospace;letter-spacing:2px;fill:#36c7ff}.phase{font:700 11px ui-monospace,Consolas,monospace;letter-spacing:1.3px;fill:#7dd7ff}.name{font:700 17px Inter,Segoe UI,sans-serif;fill:#f4f8fb}.copy{font:400 12.5px Inter,Segoe UI,sans-serif;fill:#aebfca}.step{fill:#10222e;stroke:#36718d;stroke-width:1.5}.review{fill:#1a2032;stroke:#7787cf;stroke-width:1.5}.release{fill:#14261f;stroke:#43c98b;stroke-width:1.5}.loopbox{fill:#211d18;stroke:#d7a54b;stroke-width:1.5}.line{fill:none;stroke:#64c9ed;stroke-width:2.2;marker-end:url(#arrow)}.loop{fill:none;stroke:#d7a54b;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}.label{font:600 11px Inter,Segoe UI,sans-serif;fill:#8bc9df}.loop-label{font:600 11px Inter,Segoe UI,sans-serif;fill:#e2b760}</style>
  </defs>
  <rect width="1600" height="780" rx="24" fill="url(#bg)"/>
  <text x="64" y="60" class="eyebrow">HUMAN-LED WORKFLOW · PART 2</text><text x="64" y="101" class="title">From assignment to an authorised Customer product</text>
  <text x="64" y="132" class="subtitle">The Lead is the accountable Camunda assignee; every assigned Analyst has the same production controls in Mist.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="242" width="238" height="154" rx="18" class="step"/>
    <text x="96" y="274" class="phase">TEAM MANAGER</text><text x="96" y="308" class="name">Name the delivery team</text>
    <text x="96" y="337" class="copy">Select one accountable Lead and</text><text x="96" y="361" class="copy">additional assigned Analysts</text>

    <rect x="358" y="242" width="238" height="154" rx="18" class="step"/>
    <text x="384" y="274" class="phase">ASSIGNED ANALYSTS</text><text x="384" y="308" class="name">Produce the product</text>
    <text x="384" y="337" class="copy">Order managed files or approved links,</text><text x="384" y="361" class="copy">then add the Customer covering note</text>

    <rect x="646" y="242" width="238" height="154" rx="18" class="review"/>
    <text x="672" y="274" class="phase">TEAM MANAGER</text><text x="672" y="308" class="name">Check quality</text>
    <text x="672" y="337" class="copy">Approve for QC or return clear</text><text x="672" y="361" class="copy">changes to the same assignment</text>

    <rect x="934" y="242" width="238" height="154" rx="18" class="review"/>
    <text x="960" y="274" class="phase">QC TEAM</text><text x="960" y="308" class="name">Review, then release</text>
    <text x="960" y="337" class="copy">One Manager reviews; a different</text><text x="960" y="361" class="copy">Manager releases or returns</text>

    <rect x="1222" y="242" width="270" height="154" rx="18" class="release"/>
    <text x="1248" y="274" class="phase">CUSTOMER</text><text x="1248" y="308" class="name">Receive and accept</text>
    <text x="1248" y="337" class="copy">Uses the dashboard artefacts and note,</text><text x="1248" y="361" class="copy">then accepts and may give feedback</text>

    <rect x="324" y="526" width="306" height="120" rx="16" class="loopbox"/>
    <text x="350" y="558" class="phase">OPTIONAL CLARIFICATION</text><text x="350" y="592" class="name">Ask the Customer directly</text>
    <text x="350" y="620" class="copy">Question and answer stay on the request</text>

    <rect x="736" y="526" width="330" height="120" rx="16" class="loopbox"/>
    <text x="762" y="558" class="phase">REWORK LOOP</text><text x="762" y="592" class="name">Return to assigned Analysts</text>
    <text x="762" y="620" class="copy">Comments stay with the request and remain actionable</text>
  </g>

  <path d="M308 319H358" class="line"/><text x="316" y="304" class="label">assign</text>
  <path d="M596 319H646" class="line"/><text x="605" y="304" class="label">submit</text>
  <path d="M884 319H934" class="line"/><text x="899" y="304" class="label">approve</text>
  <path d="M1172 319H1222" class="line"/><text x="1181" y="304" class="label">release</text>
  <path d="M477 396V526" class="loop"/><text x="492" y="463" class="loop-label">ask</text>
  <path d="M324 586C252 586 260 436 420 396" class="loop"/><text x="232" y="520" class="loop-label">answer</text>
  <path d="M765 396C770 450 802 484 842 526" class="loop"/><text x="782" y="451" class="loop-label">changes</text>
  <path d="M1053 396C1048 460 1012 494 980 526" class="loop"/><text x="1044" y="463" class="loop-label">changes</text>
  <path d="M736 586C656 586 612 508 538 396" class="loop"/>

  <line x1="70" y1="700" x2="1492" y2="700" stroke="#203746"/>
  <text x="70" y="733" class="copy">The route does not travel back through CRIOC, command or Ops for approval.</text>
  <text x="514" y="733" class="label">Team review, QC review and a different QC releaser protect the package.</text>
</svg>
